name: Build Deployment Artifact

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build Release Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build test-app
        if: github.ref_name == 'v1.0.0' || github.ref_name == 'v1.1.0' || github.ref_name == 'v1.2.0' || github.ref_name == 'v1.3.0'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          EXPECTED="version=${VERSION}"

          grep -Fxq "$EXPECTED" app/version.txt

          ARTIFACT="test-app-${VERSION}.tar.gz"

          tar \
            --create \
            --gzip \
            --file "$ARTIFACT" \
            --directory app \
            .

          sha256sum "$ARTIFACT" > "${ARTIFACT}.sha256"

      - name: Build another-app
        if: github.ref_name == 'v2.0.0'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          EXPECTED="version=${VERSION}"

          grep -Fxq "$EXPECTED" app2/version.txt

          ARTIFACT="another-app-${VERSION}.tar.gz"

          tar \
            --create \
            --gzip \
            --file "$ARTIFACT" \
            --directory app2 \
            .

          sha256sum "$ARTIFACT" > "${ARTIFACT}.sha256"

      - name: Show artifacts
        shell: bash
        run: |
          echo "Generated artifacts:"
          ls -lh *.tar.gz *.sha256

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          if [[ "$VERSION" == "2.0.0" ]]; then
            ARTIFACT="another-app-${VERSION}.tar.gz"
          else
            ARTIFACT="test-app-${VERSION}.tar.gz"
          fi

          gh release create "${GITHUB_REF_NAME}" \
            "$ARTIFACT" \
            "${ARTIFACT}.sha256" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
