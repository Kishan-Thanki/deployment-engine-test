name: Build Deployment Artifact

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  APP_NAME: deployment-test
  APP_DIRECTORY: app

jobs:
  build:
    name: Build Release Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate application
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          [[ -d "$APP_DIRECTORY" ]] ||
            { echo "Application directory does not exist: $APP_DIRECTORY"; exit 1; }

          [[ -f "$APP_DIRECTORY/version.txt" ]] ||
            { echo "Missing version file: $APP_DIRECTORY/version.txt"; exit 1; }

          grep -Fxq \
            "version=${VERSION}" \
            "$APP_DIRECTORY/version.txt"

      - name: Build deployment artifact
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARTIFACT="${APP_NAME}-${VERSION}.tar.gz"

          tar \
            --create \
            --gzip \
            --file "$ARTIFACT" \
            --directory "$APP_DIRECTORY" \
            .

          sha256sum "$ARTIFACT" \
            > "${ARTIFACT}.sha256"

      - name: Verify generated artifacts
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARTIFACT="${APP_NAME}-${VERSION}.tar.gz"

          [[ -f "$ARTIFACT" ]] ||
            { echo "Missing artifact: $ARTIFACT"; exit 1; }

          [[ -f "${ARTIFACT}.sha256" ]] ||
            { echo "Missing checksum: ${ARTIFACT}.sha256"; exit 1; }

          echo "Generated artifacts:"
          ls -lh \
            "$ARTIFACT" \
            "${ARTIFACT}.sha256"

          echo
          echo "Checksum:"
          cat "${ARTIFACT}.sha256"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARTIFACT="${APP_NAME}-${VERSION}.tar.gz"

          gh release create \
            "${GITHUB_REF_NAME}" \
            "$ARTIFACT" \
            "${ARTIFACT}.sha256" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
