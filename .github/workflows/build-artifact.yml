name: Build Deployment Artifact

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  APP_NAME: another-app
  APP_DIRECTORY: app2

jobs:
  build:
    name: Build Release Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate application configuration
        shell: bash
        run: |
          [[ -n "$APP_NAME" ]] ||
            { echo "APP_NAME cannot be empty"; exit 1; }

          [[ -d "$APP_DIRECTORY" ]] ||
            { echo "APP_DIRECTORY does not exist: $APP_DIRECTORY"; exit 1; }

          [[ -f "$APP_DIRECTORY/version.txt" ]] ||
            { echo "Missing version file: $APP_DIRECTORY/version.txt"; exit 1; }

      - name: Validate application version
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          EXPECTED="version=${VERSION}"

          grep -Fxq "$EXPECTED" "${APP_DIRECTORY}/version.txt"

      - name: Build deployment artifact
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          ARTIFACT="${APP_NAME}-${VERSION}.tar.gz"

          tar \
            --create \
            --gzip \
            --file "$ARTIFACT" \
            --directory "$APP_DIRECTORY" \
            .

          sha256sum "$ARTIFACT" > "${ARTIFACT}.sha256"

      - name: Show artifacts
        shell: bash
        run: |
          echo "Generated artifacts:"
          ls -lh \
            "${APP_NAME}-${{ steps.version.outputs.version }}.tar.gz" \
            "${APP_NAME}-${{ steps.version.outputs.version }}.tar.gz.sha256"

          echo
          echo "Checksum:"
          cat \
            "${APP_NAME}-${{ steps.version.outputs.version }}.tar.gz.sha256"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARTIFACT="${APP_NAME}-${VERSION}.tar.gz"

          gh release create "${GITHUB_REF_NAME}" \
            "$ARTIFACT" \
            "${ARTIFACT}.sha256" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
