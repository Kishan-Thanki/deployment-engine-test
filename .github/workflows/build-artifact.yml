name: Build Deployment Artifact

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build Release Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Determine application
        id: application
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          MAJOR="${VERSION%%.*}"

          case "$MAJOR" in
            1)
              APP_NAME="test-app"
              APP_DIRECTORY="app"
              ;;

            2)
              APP_NAME="another-app"
              APP_DIRECTORY="app2"
              ;;

            *)
              echo "Unsupported application major version: $MAJOR"
              exit 1
              ;;
          esac

          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"
          echo "app_directory=$APP_DIRECTORY" >> "$GITHUB_OUTPUT"

      - name: Validate application version
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APP_DIRECTORY="${{ steps.application.outputs.app_directory }}"

          EXPECTED="version=${VERSION}"

          grep -Fxq "$EXPECTED" "${APP_DIRECTORY}/version.txt"

      - name: Build deployment artifact
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APP_NAME="${{ steps.application.outputs.app_name }}"
          APP_DIRECTORY="${{ steps.application.outputs.app_directory }}"

          ARTIFACT="${APP_NAME}-${VERSION}.tar.gz"

          tar \
            --create \
            --gzip \
            --file "$ARTIFACT" \
            --directory "$APP_DIRECTORY" \
            .

          sha256sum "$ARTIFACT" > "${ARTIFACT}.sha256"

      - name: Show artifacts
        shell: bash
        run: |
          echo "Generated artifacts:"
          ls -lh *.tar.gz *.sha256

          echo
          echo "Checksums:"
          cat *.sha256

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APP_NAME="${{ steps.application.outputs.app_name }}"

          ARTIFACT="${APP_NAME}-${VERSION}.tar.gz"

          gh release create "${GITHUB_REF_NAME}" \
            "$ARTIFACT" \
            "${ARTIFACT}.sha256" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
